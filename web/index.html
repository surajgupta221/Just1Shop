<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Just1Shop - groceries and daily essentials delivered under 24 hours.">
  <link rel="canonical" href="https://www.just1shop.com/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Just1Shop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Just1Shop</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #recaptcha-container {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 9999;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="recaptcha-container"></div>
  <script>
    if (window.location.hash && window.location.hash.startsWith('#/')) {
      const target = window.location.hash.substring(1);
      window.history.replaceState(null, '', target + window.location.search);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }
    if ('caches' in window) {
      caches.keys().then((keys) => {
        keys.forEach((key) => caches.delete(key));
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
